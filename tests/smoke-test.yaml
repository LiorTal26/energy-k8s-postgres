apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-smoke-test-sql
  namespace: postgres-operator
data:
  smoke-test.sql: |
    \set ON_ERROR_STOP on

    CREATE TABLE IF NOT EXISTS assignment_smoke_test (
      id integer PRIMARY KEY,
      checked_at timestamptz NOT NULL DEFAULT now(),
      message text NOT NULL
    );

    INSERT INTO assignment_smoke_test (id, message)
    VALUES (1, 'Percona PostgreSQL on Kubernetes is reachable')
    ON CONFLICT (id) DO UPDATE
      SET checked_at = now(), message = EXCLUDED.message;

    SELECT
      current_database() AS database,
      current_user AS database_user,
      current_setting('server_version') AS postgres_version,
      message AS smoke_test_result
    FROM assignment_smoke_test
    WHERE id = 1;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-smoke-test
  namespace: postgres-operator
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-smoke-test
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: docker.io/percona/percona-distribution-postgresql:17.10-1
          imagePullPolicy: IfNotPresent
          command:
            - psql
          args:
            - -v
            - ON_ERROR_STOP=1
            - -f
            - /sql/smoke-test.sql
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: energy-pg-pguser-energyapp
                  key: pgbouncer-host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: energy-pg-pguser-energyapp
                  key: pgbouncer-port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: energy-pg-pguser-energyapp
                  key: user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: energy-pg-pguser-energyapp
                  key: password
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: energy-pg-pguser-energyapp
                  key: dbname
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGSSLMODE
              value: require
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: sql
          configMap:
            name: postgres-smoke-test-sql
